name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    # Static repository guards, notebook structure, and the dependency-light
    # unit tests. The heavy research stack (torch, autogluon, ...) is not
    # installed, so tests that need it are not part of this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-mlops.txt
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-mlops.txt pytest
      - name: Repository guards and notebook validation
        run: |
          python -m pytest scripts/tests -q
          python scripts/validate_notebooks.py
      - name: MLOps unit tests
        run: python -m pytest mlops/tests -q
      - name: RecSys ranking metrics
        run: python -m pytest experiments/recommender_systems/tests -q
