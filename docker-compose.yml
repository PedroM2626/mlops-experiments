services:
  ml_api:
    build: .
    container_name: mlops_enterprise_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    # real serving of the champion via FastAPI + local MLflow registry
    # tracking URI used by the code: experiments/mlops_tracking.db (SQLite,
    # mlops/config.py; override with MLFLOW_TRACKING_URI). This service only
    # browses the legacy file store in experiments/mlruns.
    volumes:
      - ./experiments:/app/experiments
      - ./experiments/artifacts/mlops_sales:/app/experiments/artifacts/mlops_sales
    command: ["python", "-m", "mlops.serve"]

  mlflow_ui:
    # matches the mlflow client pinned in requirements.txt
    image: ghcr.io/mlflow/mlflow:v3.11.1
    container_name: mlflow_ui
    ports:
      - "5000:5000"
    volumes:
      - ./experiments/mlruns:/mlruns
    command: ["mlflow", "ui", "--host", "0.0.0.0", "--backend-store-uri", "file:///mlruns"]

  mlops_monitor:
    build: .
    container_name: mlops_monitor
    restart: always
    env_file:
      - .env
    volumes:
      - ./experiments:/app/experiments
      - ./experiments/artifacts/mlops_sales:/app/experiments/artifacts/mlops_sales
    command: ["python", "-m", "mlops.monitor", "--loop", "--auto"]
    depends_on:
      ml_api:
        condition: service_healthy
