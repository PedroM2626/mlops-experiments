services:
  ml_api:
    build: .
    container_name: mlops_enterprise_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    # serving real do campeao via FastAPI + MLflow registry local
    # tracking URI do codigo: <repo>/experiments/mlruns (mlops/config.py)
    volumes:
      - ./experiments:/app/experiments
      - ./experiments/artifacts/mlops_sales:/app/experiments/artifacts/mlops_sales
    command: ["python", "-m", "mlops.serve"]

  mlflow_ui:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: mlflow_ui
    ports:
      - "5000:5000"
    volumes:
      - ./experiments/mlruns:/mlruns
    command: ["mlflow", "ui", "--host", "0.0.0.0", "--backend-store-uri", "file:///mlruns"]

  mlops_monitor:
    build: .
    container_name: mlops_monitor
    restart: always
    env_file:
      - .env
    volumes:
      - ./experiments:/app/experiments
      - ./experiments/artifacts/mlops_sales:/app/experiments/artifacts/mlops_sales
    command: ["python", "-m", "mlops.monitor", "--loop", "--auto"]
    depends_on:
      ml_api:
        condition: service_healthy
