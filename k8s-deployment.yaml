# MLOps API (sales-forecast v2.2) — exemplo pronto p/ cluster.
# Troque `image:` pela sua imagem publicada e crie o secret `mlops-secrets`
# (ex.: MLFLOW_TRACKING_URI, DAGSHUB/DB credenciais). Aplique com:
#   kubectl apply -f k8s-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-api-deployment
  labels:
    app: mlops-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mlops-api
  template:
    metadata:
      labels:
        app: mlops-api
    spec:
      containers:
      - name: mlops-api
        image: mlops-enterprise-api:latest # substitua por <registry>/<repo>:<tag>
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MLFLOW_TRACKING_URI
          value: "/app/experiments/mlruns"
        - name: API_PORT
          value: "8000"
        envFrom:
        - secretRef:
            name: mlops-secrets
            optional: true
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: mlruns
          mountPath: /app/experiments/mlruns
        - name: mlops-data
          mountPath: /app/experiments/artifacts/mlops_sales
      volumes:
      - name: mlruns
        persistentVolumeClaim:
          claimName: mlruns-pvc
      - name: mlops-data
        persistentVolumeClaim:
          claimName: mlops-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-api-service
spec:
  selector:
    app: mlops-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
---
# Volumes persistentes do registry MLflow e do SQLite/drift do MLOps.
# Ajuste `storageClassName`/tamanhos ao seu cluster (valores abaixo: dev).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlruns-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlops-data-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
