# MLOps API (sales-forecast v2.2) — cluster-ready example.
# Replace `image:` with your published image and create the secret `mlops-secrets`
# (e.g. MLFLOW_TRACKING_URI, DAGSHUB/DB credentials). Apply with:
#   kubectl apply -f k8s-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-api-deployment
  labels:
    app: mlops-api
spec:
  # One replica on purpose: tracking is a SQLite file and both volumes are
  # ReadWriteOnce, so a second pod would either fail to mount them or write to
  # the same SQLite file concurrently. Recreate (not RollingUpdate) because the
  # new pod cannot attach the volumes while the old one still holds them.
  # To scale out, point MLFLOW_TRACKING_URI at a shared server (e.g. Postgres),
  # move the data volume to ReadWriteMany storage, then raise `replicas`.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlops-api
  template:
    metadata:
      labels:
        app: mlops-api
    spec:
      containers:
      - name: mlops-api
        image: mlops-enterprise-api:latest # replace with <registry>/<repo>:<tag>
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MLFLOW_TRACKING_URI
          # lives on the mlops-data volume so it survives pod restarts
          value: "sqlite:////app/experiments/artifacts/mlops_sales/mlops_tracking.db"
        - name: API_PORT
          value: "8000"
        envFrom:
        - secretRef:
            name: mlops-secrets
            optional: true
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: mlruns
          mountPath: /app/experiments/mlruns
        - name: mlops-data
          mountPath: /app/experiments/artifacts/mlops_sales
      volumes:
      - name: mlruns
        persistentVolumeClaim:
          claimName: mlruns-pvc
      - name: mlops-data
        persistentVolumeClaim:
          claimName: mlops-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-api-service
spec:
  selector:
    app: mlops-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
---
# Persistent volumes for the MLflow registry and for MLOps SQLite/drift.
# Adjust `storageClassName`/sizes to your cluster (values below: dev).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlruns-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlops-data-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
